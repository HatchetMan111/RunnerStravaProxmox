[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localtrack"
version = "0.1.0"
description = "Local-first sports activity tracking: offline PWA recording, self-hosted sync, own server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LocalTrack contributors" }]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "gpxpy>=1.6,<2",
    "fitdecode>=0.10,<0.11",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools]
packages = [
    "app",
    "app.routers",
    "app.services",
    "app.services.parsers",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
